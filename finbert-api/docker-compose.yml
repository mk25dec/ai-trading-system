# Coolify: new Docker Compose resource → repo path /finbert-api/docker-compose.yml
services:
  finbert-api:
    build: .
    restart: unless-stopped
    environment:
      FINBERT_API_KEY: ${FINBERT_API_KEY:?set FINBERT_API_KEY}
      HF_HOME: /models
    volumes:
      - finbert_models:/models
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  finbert_models:
