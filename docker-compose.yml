# Production / Coolify. DATABASE_NETWORK_NAME is the Docker *network* name (usually
# "coolify"), NOT the hostname inside DATABASE_URL (often a swr70… UUID).
services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_PORT: ${API_PORT:-8090}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      DUCKDB_PATH: ${DUCKDB_PATH:-/data/analytics.duckdb}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY}
      FINBERT_URL: ${FINBERT_URL:-${FINBERT_API_URL:-https://finbert.derisory.nl}}
      FINBERT_API_KEY: ${FINBERT_API_KEY:?set FINBERT_API_KEY}
      ALPACA_DATA_URL: ${ALPACA_DATA_URL:-https://data.alpaca.markets/v2}
      ALPACA_DATA_FEED: ${ALPACA_DATA_FEED:-iex}
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
    volumes:
      - duckdb_data:/data
    expose:
      - "${API_PORT:-8090}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${API_PORT}/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - default
      - database

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    environment:
      API_PORT: ${API_PORT:-8090}
    depends_on:
      api:
        condition: service_started
    # Coolify Traefik routes to expose :80. No host ports (conflicts with coolify-proxy :8080).
    expose:
      - "80"
    networks:
      - default

volumes:
  duckdb_data:

networks:
  database:
    external: true
    name: ${DATABASE_NETWORK_NAME:-coolify}
