# Production / Coolify. DATABASE_NETWORK_NAME is the Docker *network* name (usually
# "coolify"), NOT the hostname inside DATABASE_URL (often a swr70… UUID).
services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_PORT: ${API_PORT:-8090}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    expose:
      - "${API_PORT:-8090}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${API_PORT}/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - default
      - database

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    environment:
      API_PORT: ${API_PORT:-8090}
    depends_on:
      api:
        condition: service_started
    # Coolify proxy uses expose :80. Optional host port for http://SERVER_IP:WEB_HOST_PORT
    # (do not use 80 — Coolify already binds host port 80).
    expose:
      - "80"
    ports:
      - "${WEB_HOST_PORT:-8080}:80"
    networks:
      - default

networks:
  database:
    external: true
    name: ${DATABASE_NETWORK_NAME:-coolify}
