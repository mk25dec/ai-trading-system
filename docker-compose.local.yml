# Local overlay: host port mapping + Postgres network.
# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   docker network create trading-local   # if using external DB on that network
services:
  api:
    networks:
      - default

  web:
    ports:
      - "${WEB_PORT:-8080}:80"

networks:
  database:
    external: true
    name: ${DATABASE_NETWORK_NAME:-trading-local}
